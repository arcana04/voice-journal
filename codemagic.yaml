workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic3
    environment:
      groups:
        - ios_signing
      vars:
        APP_STORE_APPLE_ID: 6804627252
        BUNDLE_ID: com.arcana04.voicejournal
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Place signing certificate on build machine
        script: |
          mkdir -p ~/Library/MobileDevice/Certificates
          echo "$CM_CERTIFICATE" | base64 --decode > ~/Library/MobileDevice/Certificates/voicejournal.p12
      - name: Install Apple intermediate certificates
        script: |
          for url in \
            "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" \
            "https://www.apple.com/certificateauthority/AppleWWDRCAG2.cer" \
            "https://www.apple.com/certificateauthority/AppleRootCA-G2.cer" \
            "https://www.apple.com/appleca/AppleIncRootCertificate.cer"; do
            file="/tmp/$(basename "$url")"
            curl -sSL "$url" -o "$file" || continue
            security import "$file" || true
          done
      - name: Set up signing certificate
        script: |
          keychain add-certificates \
            --certificate ~/Library/MobileDevice/Certificates/voicejournal.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Place provisioning profile on build machine
        script: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/voicejournal.mobileprovision
          echo "$CM_PROVISIONING_PROFILE_WIDGET" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/voicejournal-widget.mobileprovision
          echo "$CM_PROVISIONING_PROFILE_WATCH" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/voicejournal-watch.mobileprovision
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Determine next build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Latest TestFlight build number: $LATEST_BUILD_NUMBER -> using $NEXT_BUILD_NUMBER"
          echo "NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-number=$NEXT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY
      - name: Upload dSYMs to Crashlytics
        script: |
          #!/usr/bin/env bash
          set -uo pipefail
          # FirebaseはSPM(Swift Package Manager)経由で解決されており、ios/Podsには
          # 存在しない(FlutterプラグインのみCocoaPods)。SPMのチェックアウトは
          # DerivedData配下のSourcePackages/(checkouts|artifacts)に展開されるため
          # そちらも探す。ツール名が"run"か"upload-symbols"かはFirebaseのSDK
          # バージョンで変わり得るため両方探索する。
          RUN_SCRIPT=$(find ios/Pods "$HOME/Library/Developer/Xcode/DerivedData" \
            -maxdepth 10 -type f \
            \( -ipath "*crashlytics*/run" -o -ipath "*crashlytics*/upload-symbols" \) \
            2>/dev/null | head -n 1)
          ARCHIVE_PATH=$(find build/ios -maxdepth 3 -name "*.xcarchive" | head -n 1)
          if [ -z "$RUN_SCRIPT" ] || [ -z "$ARCHIVE_PATH" ]; then
            echo "::warning::FirebaseCrashlytics upload tool or .xcarchive not found (RUN_SCRIPT='$RUN_SCRIPT' ARCHIVE_PATH='$ARCHIVE_PATH') - dSYM upload skipped for this build, but continuing so TestFlight delivery is not blocked."
            echo "Debug: contents of SourcePackages (if any):"
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 4 -iname "SourcePackages" -exec find {} -maxdepth 2 \; 2>/dev/null
            exit 0
          fi
          echo "Using FirebaseCrashlytics upload tool: $RUN_SCRIPT"
          find "$ARCHIVE_PATH/dSYMs" -maxdepth 1 -name "*.dSYM" -print0 | \
            while IFS= read -r -d '' dsym; do
              echo "Uploading dSYM: $dsym"
              "$RUN_SCRIPT" -gsp ios/Runner/GoogleService-Info.plist -p ios "$dsym"
            done
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
          - OutTester
