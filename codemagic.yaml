workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic3
    environment:
      groups:
        - ios_signing
      vars:
        APP_STORE_APPLE_ID: 6804627252
        BUNDLE_ID: com.arcana04.voicejournal
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Place signing certificate on build machine
        script: |
          mkdir -p ~/Library/MobileDevice/Certificates
          echo "$CM_CERTIFICATE" | base64 --decode > ~/Library/MobileDevice/Certificates/voicejournal.p12
      - name: Install Apple intermediate certificates
        script: |
          for url in \
            "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" \
            "https://www.apple.com/certificateauthority/AppleWWDRCAG2.cer" \
            "https://www.apple.com/certificateauthority/AppleRootCA-G2.cer" \
            "https://www.apple.com/appleca/AppleIncRootCertificate.cer"; do
            file="/tmp/$(basename "$url")"
            curl -sSL "$url" -o "$file" || continue
            security import "$file" || true
          done
      - name: Set up signing certificate
        script: |
          keychain add-certificates \
            --certificate ~/Library/MobileDevice/Certificates/voicejournal.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Place provisioning profile on build machine
        script: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/voicejournal.mobileprovision
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-number=$CM_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
